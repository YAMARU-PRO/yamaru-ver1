<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAMARU 碳陶煞車盤 (CCB) 專業規格匹配系統 Ultra Pro</title>
    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --accent-gold: #ffb703;
            --accent-orange: #fb8500;
            --accent-green: #06d6a0;
            --accent-neon-yellow: #ccff00;
            --accent-neon-green: #00ff66;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-gold);
            padding-bottom: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            margin: 0;
            font-size: 1.6rem;
            color: var(--accent-gold);
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .lang-select {
            background-color: #2a2a2a;
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            padding: 9px 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            outline: none;
        }

        .lang-select option {
            background-color: #1e1e1e;
            color: var(--text-main);
        }

        button {
            background-color: #2a2a2a;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background-color: var(--accent-orange);
            color: #000;
        }

        .btn-gold {
            background-color: var(--accent-gold);
            color: #000;
            font-weight: bold;
        }

        .btn-gold:hover {
            background-color: var(--accent-orange);
        }

        .select-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        select, input {
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.95rem;
            width: 100%;
            box-sizing: border-box;
        }

        select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .section-title {
            font-size: 1.1rem;
            color: var(--accent-gold);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 18px;
            background-color: var(--accent-gold);
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
        }

        .mid-card {
            border: 1px solid var(--accent-orange);
            background: linear-gradient(145deg, #1e1e1e, #261f18);
        }

        .upgrade-card {
            border: 1px solid var(--accent-gold);
            background: linear-gradient(145deg, #1e1e1e, #25231c);
        }

        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }

        .row-sub-title {
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--accent-orange);
            margin-bottom: 10px;
            border-bottom: 1px dashed #444;
            padding-bottom: 5px;
        }

        .spec-box {
            background-color: #141414;
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid var(--accent-orange);
        }

        .spec-box .val {
            font-size: 1.05rem;
            font-weight: bold;
            color: #fff;
            margin-top: 5px;
        }

        .neon-box {
            border-left: 4px solid var(--accent-neon-yellow);
            background-color: #0f140d;
        }

        .val-neon {
            font-size: 1.4rem !important;
            font-weight: 900;
            color: var(--accent-neon-yellow) !important;
            text-shadow: 0 0 10px rgba(204, 255, 0, 0.4);
            letter-spacing: 0.5px;
            margin-top: 6px;
            line-height: 1.3;
        }

        .val-neon-sm {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--accent-neon-yellow);
            text-shadow: 0 0 8px rgba(204, 255, 0, 0.4);
            margin: 0 4px;
            display: inline-block;
        }

        .badge-green { 
            background-color: var(--accent-green); 
            color: #000; 
            font-size: 1.2rem; 
            padding: 3px 8px;
            border-radius: 4px;
            vertical-align: middle;
        }

        .loading-text {
            color: var(--accent-gold);
            font-size: 0.85rem;
            display: none;
        }

        @media (max-width: 900px) {
            .select-bar, .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
        }

        @media print {
            body { background-color: #fff; color: #000; }
            .controls, .select-bar, button { display: none; }
            .card { border: 1px solid #ccc; box-shadow: none; background: #fff; color: #000; }
            .spec-box { background: #f9f9f9; color: #000; border-left-color: #000; }
            .spec-box .val { color: #000; }
            .section-title { color: #000; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 id="appTitle">YAMARU 碳陶煞車盤 (CCB) 專業規格匹配系統 Ultra Pro</h1>
        <div class="controls">
            <select id="langSelect" class="lang-select" onchange="changeLanguage()">
                <option value="zh-TW" selected>中 (繁體)</option>
                <option value="zh-CN">中 (简体)</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
            </select>
            <button id="btnToggleManual" onclick="toggleManualMode()">切換手動/API模式</button>
            <button id="btnPrint" class="btn-gold" onclick="window.print()">列印 / 產生施工報價單 PDF</button>
        </div>
    </header>

    <!-- 3層選單：品牌 -> 年份 -> 車款 -->
    <div class="select-bar" id="apiSelectBar">
        <div class="form-group">
            <label id="lblBrand">1. 選擇汽車品牌 (Brand)</label>
            <select id="brandSelect" onchange="onBrandChange()">
                <option value="">-- 請選擇品牌 --</option>
            </select>
        </div>
        <div class="form-group">
            <label id="lblYear">2. 選擇年份 (Year)</label>
            <select id="yearSelect" onchange="onYearChange()" disabled>
                <option value="">-- 請先選擇品牌 --</option>
            </select>
        </div>
        <div class="form-group">
            <label><span id="lblModel">3. 選擇車款 (Model)</span> <span id="modelLoading" class="loading-text">載入中...</span></label>
            <select id="modelSelect" onchange="renderSpecs()" disabled>
                <option value="">-- 請先選擇年份 --</option>
            </select>
        </div>
    </div>

    <!-- 上行：原始數據 -->
    <div class="section-title" id="secTitleOriginal">上行：目前車輛原廠原始出廠數據</div>
    <div class="card">
        <div class="grid-4" style="margin-bottom: 15px;">
            <div class="spec-box"><label id="lblOemFront">原廠前煞車盤徑</label><div class="val" id="oemFront">-</div></div>
            <div class="spec-box"><label id="lblOemRear">原廠後煞車盤徑</label><div class="val" id="oemRear">-</div></div>
            <div class="spec-box"><label id="lblPcdCb">螺絲孔距 (PCD) / 中心孔 (CB)</label><div class="val" id="pcdCb" style="color: var(--accent-gold);">-</div></div>
            <div class="spec-box"><label id="lblOemLug">原廠螺絲/螺帽 規格 (長度)</label><div class="val" id="oemLug" style="color: var(--accent-gold);">-</div></div>
        </div>
        <div class="grid-4">
            <div class="spec-box"><label id="lblEngineType">引擎型號</label><div class="val" id="engineType">-</div></div>
            <div class="spec-box"><label id="lblPowerTorque">最大馬力 / 最大扭力</label><div class="val" id="powerTorque">-</div></div>
            <div class="spec-box"><label id="lblGearbox">變速箱型號</label><div class="val" id="gearbox">-</div></div>
            <div class="spec-box"><label id="lblDrivetrain">動力驅動方式</label><div class="val" id="drivetrain">-</div></div>
        </div>
    </div>

    <!-- 中行：雙行佈局 (目前裝設輪圈 vs 預計更改輪圈) -->
    <div class="section-title" id="secTitleWheels">中行：前後軸輪圈搭配與尺寸變更（前後獨立設定）</div>
    <div class="card mid-card">
        
        <div class="row-sub-title" id="subTitleCurrentWheels">【目前車輛出廠 / 現車安裝輪圈規格】</div>
        <div class="grid-2" style="margin-bottom: 20px;">
            <div class="spec-box">
                <label id="lblCurrentFrontWheel" style="color: var(--accent-gold);">前輪原廠/現車輪圈尺寸</label>
                <div class="val" id="currentFrontWheelDisplay">-</div>
            </div>
            <div class="spec-box">
                <label id="lblCurrentRearWheel" style="color: var(--accent-gold);">後輪原廠/現車輪圈尺寸</label>
                <div class="val" id="currentRearWheelDisplay">-</div>
            </div>
        </div>

        <div class="row-sub-title" id="subTitleNewWheels">【預計升級 / 欲更改之改裝輪圈規格】</div>
        <div class="grid-2">
            <!-- 前輪改裝設定 -->
            <div class="form-group" style="background-color: #181818; padding: 12px; border-radius: 8px;">
                <label id="lblNewFrontBox" style="color: var(--accent-green); font-weight: bold;">前輪 (Front) 欲更改規格</label>
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 5px;">
                    <div>
                        <label class="lblInch">吋數</label>
                        <select id="newFrontSize" onchange="calculateDynamicUpgrade()">
                            <option value="18">18 吋</option>
                            <option value="19" selected>19 吋</option>
                            <option value="20">20 吋</option>
                            <option value="21">21 吋</option>
                        </select>
                    </div>
                    <div>
                        <label class="lblJ">J 數</label>
                        <select id="newFrontJ" onchange="calculateDynamicUpgrade()">
                            <option value="8.0">8.0 J</option>
                            <option value="8.5" selected>8.5 J</option>
                            <option value="9.0">9.0 J</option>
                            <option value="9.5">9.5 J</option>
                        </select>
                    </div>
                    <div>
                        <label class="lblET">ET 值</label>
                        <select id="newFrontET" onchange="calculateDynamicUpgrade()">
                            <option value="40">ET 40</option>
                            <option value="35">ET 35</option>
                            <option value="25" selected>ET 25</option>
                            <option value="20">ET 20</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 後輪改裝設定 -->
            <div class="form-group" style="background-color: #181818; padding: 12px; border-radius: 8px;">
                <label id="lblNewRearBox" style="color: var(--accent-green); font-weight: bold;">後輪 (Rear) 欲更改規格</label>
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 5px;">
                    <div>
                        <label class="lblInch">吋數</label>
                        <select id="newRearSize" onchange="calculateDynamicUpgrade()">
                            <option value="18">18 吋</option>
                            <option value="19" selected>19 吋</option>
                            <option value="20">20 吋</option>
                            <option value="21">21 吋</option>
                        </select>
                    </div>
                    <div>
                        <label class="lblJ">J 數</label>
                        <select id="newRearJ" onchange="calculateDynamicUpgrade()">
                            <option value="9.0">9.0 J</option>
                            <option value="9.5" selected>9.5 J</option>
                            <option value="10.0">10.0 J</option>
                            <option value="10.5">10.5 J</option>
                        </select>
                    </div>
                    <div>
                        <label class="lblET">ET 值</label>
                        <select id="newRearET" onchange="calculateDynamicUpgrade()">
                            <option value="40">ET 40</option>
                            <option value="35">ET 35</option>
                            <option value="25" selected>ET 25</option>
                            <option value="20">ET 20</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- 下行：升級方案 (自動運算結果) -->
    <div class="section-title" id="secTitleUpgrade">下行：YAMARU 自動計算之最適配碳陶升級與硬體配套方案</div>
    <div class="card upgrade-card">
        <div class="grid-4" style="margin-bottom: 15px;">
            <div class="spec-box neon-box">
                <label id="lblCcbFrontSize" style="color: var(--accent-neon-yellow); font-weight: bold;">推薦前碳陶盤尺寸 (Front CCB)</label>
                <div class="val val-neon" id="ccbFrontSize">No. 058 (380x36xD60)</div>
            </div>
            <div class="spec-box neon-box">
                <label id="lblCcbRearSize" style="color: var(--accent-neon-yellow); font-weight: bold;">推薦後碳陶盤尺寸 (Rear CCB)</label>
                <div class="val val-neon" id="ccbRearSize">No. 042 (370x30xD60)</div>
            </div>
            <div class="spec-box">
                <label id="lblUpgradeLug" style="color: var(--accent-gold);">建議 (BOLT)螺絲 / (NUT) 螺帽 (含長度試算)</label>
                <div class="val" id="upgradeLug" style="line-height: 1.8; margin-top: 8px;">
                    -
                </div>
            </div>
            <div class="spec-box" style="border-left-color: var(--accent-green);">
                <label id="lblWeightSaving">簧下重量減輕效益 (Unsprung Weight)</label>
                <div class="val" id="weightSaving" style="color: var(--accent-green);">-</div>
            </div>
        </div>

        <div class="grid-3" style="margin-bottom: 15px;">
            <!-- 【新增/優化】：可由客戶自行選取的 D碼（中心花盒）下拉選單 -->
            <div class="spec-box">
                <label id="lblHatSelect" style="color: var(--accent-gold);">中心花盒結構 (D碼選擇 / 搭配卡鉗)</label>
                <select id="hatSelect" onchange="calculateDynamicUpgrade()" style="margin-top: 5px;">
                    <!-- JS 動態寫入選單 -->
                </select>
            </div>
            <div class="spec-box">
                <label id="lblCcbType" style="color: var(--accent-gold);">碳陶盤結構系列 (纖維系列)</label>
                <select id="ccbTypeSelect" onchange="calculateDynamicUpgrade()" style="margin-top: 5px;">
                    <!-- JS 動態寫入選單 -->
                </select>
            </div>
            <div class="spec-box">
                <label id="lblPadSelect" style="color: var(--accent-gold);">推薦專用煞車皮 (配方選擇)</label>
                <select id="padSelect" onchange="calculateDynamicUpgrade()" style="margin-top: 5px; margin-bottom: 8px;">
                    <!-- JS 動態寫入選單 -->
                </select>
                <div class="val" id="padDetail" style="font-size: 0.88rem; font-weight: normal; color: #e0e0e0;">-</div>
            </div>
        </div>

        <div class="grid-3">
            <div class="spec-box">
                <label id="lblEpbDetail">後軸 EPB 電子手煞車與卡鉗轉接配套</label>
                <div class="val" id="epbDetail" style="font-size: 0.88rem; font-weight: normal; color: #e0e0e0;">-</div>
            </div>
            <div class="spec-box">
                <label id="lblSafetyDetail">螺絲安全鎖固深度與總泵腳感建議</label>
                <div class="val" id="safetyDetail" style="font-size: 0.88rem; font-weight: normal; color: #e0e0e0;">-</div>
            </div>
            <div class="spec-box">
                <label id="lblClearanceDetail">改裝軸套 (Hub Ring) 與卡鉗橫向 X-Factor 隙樣</label>
                <div class="val" id="clearanceDetail" style="font-size: 0.88rem; font-weight: normal; color: #e0e0e0;">-</div>
            </div>
        </div>
    </div>
</div>

<script>

// 自動匹配 YAMARU 102 款規格核心演算法（加入選取之 D碼比對）
function findBestCCBSpec(rimSize, position, targetHatD) {
    let maxD = 360;
    if (rimSize >= 21) maxD = 425;
    else if (rimSize >= 20) maxD = 400;
    else if (rimSize >= 19) maxD = 380;
    else maxD = 360;

    if (position === 'rear') {
        maxD -= 15;
    }

    // 優先比對直徑符合且 D碼 (如 D60 / D54) 完全一致的項目
    let eligible = yamaru102Specs.filter(item => item.d <= maxD && item.d1 === targetHatD);
    
    // 若特定 D碼無精準匹配，降級為僅比對直徑
    if (eligible.length === 0) {
        eligible = yamaru102Specs.filter(item => item.d <= maxD);
    }
    
    if (eligible.length === 0) return "No. 001 (330 x 22 x D54)";

    const best = eligible[eligible.length - 1];
    return `No. ${best.no}<br><span style="font-size: 1.1rem; color: #fff;">(${best.spec})</span>`;
}

function onBrandChange() {
    const dict = getCurrentDict();
    const brand = document.getElementById('brandSelect').value;
    const yearSel = document.getElementById('yearSelect');
    const modelSel = document.getElementById('modelSelect');

    yearSel.innerHTML = `<option value="">${dict.optSelectYear}</option>`;
    modelSel.innerHTML = `<option value="">${dict.optFirstYear}</option>`;
    modelSel.disabled = true;
    clearSpecsUI();

    if (!brand) {
        yearSel.disabled = true;
        return;
    }

    const currentYear = new Date().getFullYear();
    for (let y = currentYear + 1; y >= 1998; y--) {
        let opt = document.createElement('option');
        opt.value = y;
        opt.textContent = y + dict.yearUnit;
        yearSel.appendChild(opt);
    }
    yearSel.disabled = false;
}

async function onYearChange() {
    const dict = getCurrentDict();
    const brand = document.getElementById('brandSelect').value;
    const year = document.getElementById('yearSelect').value;
    const modelSel = document.getElementById('modelSelect');
    const modelLoading = document.getElementById('modelLoading');

    modelSel.innerHTML = `<option value="">${dict.optSelectModel}</option>`;
    clearSpecsUI();

    if (!brand || !year) {
        modelSel.disabled = true;
        return;
    }

    modelLoading.style.display = 'inline';
    modelSel.disabled = true;

    try {
        const res = await fetch(`https://vpic.nhtsa.dot.gov/api/vehicles/getmodelsformakeyear/make/${encodeURIComponent(brand)}/modelyear/${year}?format=json`);
        const data = await res.json();

        let models = [...new Set(data.Results.map(item => item.Model_Name))].sort();

        if (models.length === 0) {
            if (brand === "XIAOMI") models = ["SU7", "SU7 Pro", "SU7 Max", "SU7 Ultra"];
            else if (brand === "BYD") models = ["U9", "U8", "Han", "Seal"];
            else models = ["General Model"];
        }

        models.forEach(m => {
            let opt = document.createElement('option');
            opt.value = m;
            opt.textContent = m;
            modelSel.appendChild(opt);
        });

        modelSel.disabled = false;
    } catch (e) {
        let opt = document.createElement('option');
        opt.value = "General Model";
        opt.textContent = "General Model";
        modelSel.appendChild(opt);
        modelSel.disabled = false;
    } finally {
        modelLoading.style.display = 'none';
    }
}

function calculateDynamicUpgrade() {
    if (!currentCarSpec) return;
    const dict = getCurrentDict();

    const newFrontSize = parseInt(document.getElementById('newFrontSize').value);
    const newFrontJ = parseFloat(document.getElementById('newFrontJ').value);
    const newFrontET = parseInt(document.getElementById('newFrontET').value);

    const newRearSize = parseInt(document.getElementById('newRearSize').value);
    const newRearJ = parseFloat(document.getElementById('newRearJ').value);
    const newRearET = parseInt(document.getElementById('newRearET').value);

    const targetHatD = document.getElementById('hatSelect').value || "D60";
    const selectedPadKey = document.getElementById('padSelect').value || "SPORT";

    // 1. 根據車主/客戶選取的 D碼 (D60 / D54) 即時演算比對 YAMARU 102 款庫
    let frontCCB = findBestCCBSpec(newFrontSize, 'front', targetHatD);
    let rearCCB = findBestCCBSpec(newRearSize, 'rear', targetHatD);
    let weightSavedKg = (newFrontSize >= 20 || newRearSize >= 20) ? 16.5 : 14.8;

    // 2. 輕量化效益
    let weightStr = `約 <strong>-${weightSavedKg} kg</strong> <span class="badge badge-green">${dict.unsprungText}</span><br>` +
                    `<span style="font-size:0.8rem; color:#a0a0a0;">${dict.unsprungDesc}</span>`;

    // 3. 螺絲長度試算
    let etDiff = currentCarSpec.oemET - newFrontET;
    let suggestedLength = currentCarSpec.oemLugLen + (etDiff > 0 ? etDiff : 0);
    let finalLengthStr = suggestedLength < 38 ? "38mm" : `${suggestedLength}mm`;

    let upgradeLugStr = `${dict.lugSpec}<span class="val-neon-sm">${currentCarSpec.oemLugThread}</span><br>` +
                        `${dict.safeLen}<span class="val-neon-sm">(${finalLengthStr})</span>`;

    // 4. 煞車皮詳細資訊
    const pad = dict.padOptions[selectedPadKey] || dict.padOptions["SPORT"];
    let padDetailStr = `<strong>【${pad.name}】</strong><br>` +
                       `μ: ${pad.mu} | Temp: ${pad.temp}<br>` +
                       `${pad.feature}`;

    // 5. 後軸 EPB 配套
    let epbSpaceText = dict.epbSpaceDesc.replace("{rearCCB}", rearCCB.replace(/<[^>]+>/g, ' '));
    let epbStr = `<strong>${dict.epbTitle}</strong>${currentCarSpec.epbType}<br>` +
                 `<strong>${dict.epbSpaceTitle}</strong>${epbSpaceText}`;

    // 6. 安全鎖固與總泵腳感
    let isM14 = currentCarSpec.oemLugThread.includes("M14");
    let minTurns = isM14 ? "9 圈 (≥13.5mm)" : "8 圈 (≥12.0mm)";
    let safetyStr = `<strong>${dict.screwTurnsTitle}</strong>${currentCarSpec.oemLugThread} ${dict.screwTurnsMin}<strong>${minTurns}</strong>。<br>` +
                    `<strong>${dict.masterCylinderTitle}</strong>${dict.masterCylinderDesc}`;

    // 7. 中心軸套與 Clearance 隙樣
    let cbVal = currentCarSpec.cbVal || 66.6;
    let hubRingDescText = dict.hubRingDesc.replace("{cbVal}", cbVal);
    let hubRingStr = `${dict.hubRingTitle}${hubRingDescText}`;
    
    let frontCalStr = dict.caliperXFront.replace("{newFrontET}", newFrontET).replace("{newFrontJ}", newFrontJ).replace("{etDiff}", etDiff > 0 ? etDiff : 0);
    let rearCalStr = dict.caliperXRear.replace("{newRearET}", newRearET).replace("{newRearJ}", newRearJ);
    
    let clearanceDetailStr = `<strong>${hubRingStr}</strong><br>` +
                             `<strong>${dict.caliperXTitle}</strong>${frontCalStr} / ${rearCalStr}${dict.caliperXSpace}`;

    // 寫回 DOM
    document.getElementById('ccbFrontSize').innerHTML = frontCCB;
    document.getElementById('ccbRearSize').innerHTML = rearCCB;
    document.getElementById('weightSaving').innerHTML = weightStr;
    document.getElementById('upgradeLug').innerHTML = upgradeLugStr;
    document.getElementById('padDetail').innerHTML = padDetailStr;
    document.getElementById('epbDetail').innerHTML = epbStr;
    document.getElementById('safetyDetail').innerHTML = safetyStr;
    document.getElementById('clearanceDetail').innerHTML = clearanceDetailStr;
}
